[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepack-cli"
version = "0.1.0"
authors = [
  { name = "Frozen-starTony", email = "assergeyx76@gmail.com" },
]
description = "Fast CLI tool to pack any codebase into clipboard/context for Claude, ChatGPT, and Gemini."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["llm", "prompt", "context", "claude", "chatgpt", "gemini", "codebase", "cli", "ai"]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
full = [
  "rich>=12.0.0",
  "pyperclip>=1.8.0",
  "pathspec>=0.11.0",
  "tiktoken>=0.5.0",
]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
codepack = "codepack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
